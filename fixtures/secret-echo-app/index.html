<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Secret echo - Fixture</title>
</head>
<body>
<main>
  <h1>Secret echo</h1>
  <p>A careless page: it echoes what was typed into the token field in every form a leak can take.</p>
  <label for="token">Access token</label>
  <input id="token" name="token" type="password" autocomplete="off">
  <label for="note">Note</label>
  <input id="note" name="note" type="text" autocomplete="off">
  <button type="button" id="show">Show echoes</button>
  <p data-testid="echo-raw" id="echo-raw"></p>
  <p data-testid="echo-uri" id="echo-uri"></p>
  <p data-testid="echo-base64" id="echo-base64"></p>
  <p data-testid="echo-base64url" id="echo-base64url"></p>
  <p data-testid="echo-prefix" id="echo-prefix"></p>
  <p data-testid="echo-upper" id="echo-upper"></p>
  <p data-testid="echo-lower" id="echo-lower"></p>
</main>
<script src="/app.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Sign in</title></head>
<body>
<main>
  <h1>Sign in</h1>
  <!-- The server's /sign-in route sets an HttpOnly session cookie and redirects to signed-in.html. -->
  <form method="get" action="/sign-in">
    <label for="name">Name</label>
    <input id="name" name="name" type="text">
    <button type="submit">Sign in</button>
  </form>
  <button type="button" id="count-tabs">Count other tabs</button>
  <p data-testid="other-tabs">not counted</p>
  <p data-testid="input-events">0</p>
</main>
<script src="counting.js"></script>
<script src="tabs.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Storage</title></head>
<body>
<main>
  <h1>Storage</h1>
  <!-- storage.js shows these storage keys of this page's origin, read again every 50 ms:
       "(none)" when a key is not set. -->
  <p data-testid="stored-docked">not read</p>
  <p data-testid="stored-greeting">not read</p>
  <button type="button" id="continue">Continue</button>
  <p data-testid="continue-state">Not continued</p>
  <p data-testid="input-events">0</p>
</main>
<script src="counting.js"></script>
<script src="continue.js"></script>
<script src="storage.js"></script>
</body>
</html>

# Required checks: "ci" runs every gate; "tests-apart" stops a pull request that changes the
# test set and the code it judges together. Both run in the dev container image, pinned by
# digest, so local and CI runs see the same Linux, Node and fonts.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  # The pinned image is started by hand rather than as a job container: it needs the seccomp
  # profile in .devcontainer/, and a job container starts before the repository is checked out.
  ci:
    runs-on: ubuntu-24.04
    steps:
      # Full history: the gates read commit trailers back to the cut-over.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Run every check and test in the pinned image
        run: |
          # The profile lets Chrome's sandbox create its namespaces, as in the dev container.
          docker run --rm \
            --security-opt seccomp=.devcontainer/seccomp-chrome-sandbox.json \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            mcr.microsoft.com/devcontainers/typescript-node:24-bookworm@sha256:970eebf5b82d3800bdd9f46680e1c4c664d365d18603148540788356700ce301 \
            bash -euo pipefail -c '
              node --version | grep -q "^v24\." || { echo "Node 24 required, found $(node --version)"; exit 1; }
              npm ci
              # The system libraries the browsers need on Linux, installed as root.
              node node_modules/playwright-core/cli.js install-deps chromium firefox webkit
              # Chrome refuses to sandbox as root, so the browsers and the check run as "node".
              chown -R node:node /workspace
              su node -c "npm run browsers && npm run check:tests"
            '
      # The real-container tests (docs/decisions/container-tests.md) start the run image's
      # containers on this runner's own Docker, so they show whether egress can be enforced in CI.
      # The pinned image runs them with the runner's Docker socket and client mounted, and with the
      # workspace at the same path as on the runner, so every folder the tests ask Docker to mount
      # exists there too. Temporary folders, such as a workload's output folder, go in the runner's
      # temp folder, also mounted at its own path, for the same reason. The step before installed
      # the Linux dependencies and browsers they use.
      - name: Run the real-container tests on the runner's Docker
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            --volume "$(command -v docker):/usr/local/bin/docker:ro" \
            --volume /usr/libexec/docker/cli-plugins:/usr/libexec/docker/cli-plugins:ro \
            --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" --workdir "$GITHUB_WORKSPACE" \
            --volume "$RUNNER_TEMP:$RUNNER_TEMP" --env TMPDIR="$RUNNER_TEMP" \
            mcr.microsoft.com/devcontainers/typescript-node:24-bookworm@sha256:970eebf5b82d3800bdd9f46680e1c4c664d365d18603148540788356700ce301 \
            bash -euo pipefail -c 'npm run check:containers'
      # The gates run even when a test failed, so a failing or flaky run is still recorded; the job
      # fails either way. They record the project's metrics and check the guarantee map.
      - name: Record the project's metrics and check the guarantee map
        if: always()
        run: |
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            mcr.microsoft.com/devcontainers/typescript-node:24-bookworm@sha256:970eebf5b82d3800bdd9f46680e1c4c664d365d18603148540788356700ce301 \
            bash -euo pipefail -c 'chown -R node:node /workspace && su node -c "npm run gates"'
      # Commits reach main without a pull request, so each pushed commit is checked on its own.
      - name: Fail if a pushed commit changes the test set and other files together
        if: always() && github.event_name == 'push'
        env:
          PUSHED_FROM: ${{ github.event.before }}
          PUSHED_TO: ${{ github.sha }}
        run: |
          # A new branch has no "before" commit; then every commit it holds is checked.
          if [ "$PUSHED_FROM" = "0000000000000000000000000000000000000000" ]; then
            PUSHED_FROM="$(git rev-list --max-parents=0 "$PUSHED_TO" | tail -n 1)"
          fi
          docker run --rm \
            --volume "$GITHUB_WORKSPACE:/workspace" --workdir /workspace \
            --env PUSHED_FROM --env PUSHED_TO \
            mcr.microsoft.com/devcontainers/typescript-node:24-bookworm@sha256:970eebf5b82d3800bdd9f46680e1c4c664d365d18603148540788356700ce301 \
            bash -euo pipefail -c 'chown -R node:node /workspace && su node -c "node tools/check-tests-apart.ts --commits $PUSHED_FROM..$PUSHED_TO"'
      - name: Add the project's metrics to the job summary
        if: always() && github.event_name == 'push'
        run: |
          if [ -f .test-results/project-metrics.md ]; then cat .test-results/project-metrics.md >> "$GITHUB_STEP_SUMMARY"; fi
          if [ -f .test-results/guarantees.md ]; then cat .test-results/guarantees.md >> "$GITHUB_STEP_SUMMARY"; fi
      - name: Keep the test results, metrics and trace index
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: .test-results/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

  tests-apart:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/devcontainers/typescript-node:24-bookworm@sha256:970eebf5b82d3800bdd9f46680e1c4c664d365d18603148540788356700ce301
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Fail if the test set and other files change together
        env:
          BASE_BRANCH: ${{ github.base_ref }}
        run: git diff --name-only "origin/$BASE_BRANCH...HEAD" | node tools/check-tests-apart.ts

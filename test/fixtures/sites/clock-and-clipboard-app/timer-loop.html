<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Timer loop</title></head>
<body>
<main>
  <h1>Timer loop</h1>
  <!-- timer-loop.js schedules a zero-delay timeout that schedules itself again, for ever. -->
  <p data-testid="loop-runs">0</p>
  <button type="button" id="continue">Continue</button>
  <p data-testid="continue-state">Not continued</p>
  <p data-testid="input-events">0</p>
</main>
<script src="counting.js"></script>
<script src="continue.js"></script>
<script src="show.js"></script>
<script src="timer-loop.js"></script>
</body>
</html>

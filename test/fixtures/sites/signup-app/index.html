<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sign up - Fixture</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="https://tracker.example/t.js" async></script>
</head>
<body>
<main>
  <h1>Create your account</h1>
  <img src="/logo.svg" width="48" height="48">
  <div class="spinner" aria-hidden="true"></div>
  <form id="signup" novalidate>
    <label for="name">Full name</label>
    <input id="name" name="name" autocomplete="name" data-pii>
    <label for="email">Email</label>
    <input id="email" name="email" type="email" autocomplete="email">
    <label><input type="checkbox" id="terms"> I agree to the terms</label>
    <button type="submit">Create account</button>
  </form>
  <p role="status" id="status" data-testid="status"></p>
  <p data-testid="echo" id="echo"></p>
  <section aria-label="Environment">
    <dl>
      <dt>Language</dt><dd data-testid="env-lang"></dd>
      <dt>Time zone</dt><dd data-testid="env-tz"></dd>
      <dt>Now</dt><dd data-testid="env-now"></dd>
      <dt>Local hour</dt><dd data-testid="env-hour"></dd>
      <dt>Random</dt><dd data-testid="env-random"></dd>
      <dt>Motion</dt><dd data-testid="env-motion"></dd>
      <dt>Scheme</dt><dd data-testid="env-scheme"></dd>
    </dl>
  </section>
  <p><a href="#a">Learn more</a> <a href="#b">Learn more</a></p>
</main>
<script src="/app.js"></script>
</body>
</html>

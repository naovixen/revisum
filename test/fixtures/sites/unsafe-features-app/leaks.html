<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Signed in</title></head>
<body>
<main>
  <h1>Signed in</h1>
  <!-- The harness serves this page with a session cookie, readable by scripts, made fresh per run. -->
  <label for="access-token">Access token</label>
  <input id="access-token" type="password">
  <p data-testid="session-shown"></p>
  <p data-testid="input-events">0</p>
</main>
<script src="counting.js"></script>
<script src="leaks.js"></script>
</body>
</html>

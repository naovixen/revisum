<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Keyboard fixture</title></head>
<body><main><h1>Keyboard fixture</h1>
<span id="menu" role="button" tabindex="0" style="cursor:pointer; border:1px solid #000; padding:4px">Menu</span><script>const m = document.getElementById("menu"); m.addEventListener("click", () => { document.title = "open"; }); m.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") document.title = "open"; });</script>
</main></body></html>
